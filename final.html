<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FE6A00">
  <meta name="description" content="Cetak Kupon BNl secara online dengan mudah dan cepat.">
  <title>Cetak Kupon BNI</title>
  <link rel="icon" type="image/png" href="./hosting.tigerengine.id/ssmuyg.jpg">
  <link rel="image_src" href="https://blogger.googleusercontent.com/img/a/AVvXsEhkXOmHr5eUfMkkQWH-hjDonzPvU1xMckXBqk48YWblw5760EpL3VKv4ja6dC0h_TRTbE9j3JkrNwcocnSKB-E7nQ9Q-eseb3-GIyLjj5u_HhBFFXdyP6nlBMqUVWqfRyAjtHmUUMI2LugHpWQ281yr8Y-tkuFvAmnxWpHOw5I5E77U-7kMi1BOWf6P">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    #main-content {
      position: relative;
      z-index: 1;
    }

    header {
      background-color: #ffffff;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
    }

    header img.logo {
      height: 50px;
    }

    .hero {
      background-color: #0a5ea9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 10px;
    }

    .hero img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .content {
      text-align: center;
      padding: 30px 20px;
    }

    .content-box {
      background-color: #0a5ea9;
      color: white;
      padding: 20px;
      border-radius: 10px;
      border: 4px solid #f7941d;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 18px;
      min-height: 100px;
      line-height: 1.6;
    }

    footer {
      background-color: #035b5b;
      height: 100px;
      margin-top: 30px;
    }

    #popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }

    #popup-overlay img {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    #calling-popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .popup-content {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .dot {
      animation: blink 1.2s infinite;
      margin-left: 5px;
    }

    @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="main-content">
    <nav style="top: 0; left: 0; right: 0; margin: 0px auto; width: 100%; height: 65px; background: #F1F5F8; z-index: 99999; border-bottom: 0.5px solid #ddd">
        <img src="https://cdn.phototourl.com/uploads/2026-03-07-169313fd-6e4a-4664-8115-2b8f604028b2.png"
            style="width: 100%; position: fixed; top: 0; left: 0; right: 0; margin: 0px auto;border-bottom: 0.5px solid #ddd">
    </nav>

    <img src="https://cdn.phototourl.com/uploads/2026-03-07-6cfdba41-df49-4fad-8ef4-57f78a216722.jpg"
        style="width: 100%; border-radius: 0px 0px 100px 0px; border-bottom: 5px double #F6AA23; outline: 2px solid #2468A5;background: #fff; box-shadow: rgba(0, 0, 0, 2.2)  0px 2px 7px 0px;">

    <section class="content">
      <div class="content-box" id="text-box"></div>
    </section>

    <center>
        <img src="https://hosting.tigerengine.id/wgdsur.jpg" style="width: 100%; position: fixed; bottom: 0; left: 0; right: 0; margin: 0px auto">
    </center>
  </div>

  <div id="popup-overlay" onclick="closeInitialPopup()">
    <img src="https://c.top4top.io/p_3718wjlcb0.jpg" alt="Popup Awal BNI">
  </div>

  <div id="calling-popup">
    <div class="popup-content">Sedang di hubungkan ke CS<span class="dot">...</span>
    </div>
  </div>

  <audio id="narration" src="https://k.top4top.io/m_3718setbj0.mp3"></audio>
  <audio id="ringtone" src="cdn.glitch.global/d1419cc7-e74f-4589-b98b-0414f2d79f97/ring-tone-68676_v%3D1748658108347.mp3" loop=""></audio>

  <script>
    const textBox = document.getElementById("text-box");
    const narration = document.getElementById("narration");
    const ringtone = document.getElementById("ringtone");
    const callingPopup = document.getElementById("calling-popup");
    const popupOverlay = document.getElementById("popup-overlay");

    const scriptText = `Terimakasih Telah Mendaftar Dilayanan Bank BCA Festival, Pendaftaran Anda Sedang Diproses, Beberapa Saat Lagi Anda Akan Dihubungi Oleh Pihak Bank BNI, Untuk Proses Cetak Kode Kupon Undian Anda`;

    function typeTextPerChar(text, duration) {
      textBox.innerHTML = "";
      const totalChars = text.length;
      const interval = (duration / totalChars) * 1000;
      let index = 0;

      function type() {
        if (index < totalChars) {
          textBox.innerHTML += text[index];
          index++;
          setTimeout(type, interval);
        }
      }
      type();
    }

    function closeInitialPopup() {
      popupOverlay.style.opacity = "0";
      ringtone.load();

      setTimeout(() => {
        popupOverlay.style.display = "none";
        
        // Putar audio dan mulai teks
        narration.play().catch(err => console.warn("Audio play blocked"));
        
        // Gunakan durasi audio asli, jika gagal default ke 18 detik
        const duration = narration.duration || 18;
        typeTextPerChar(scriptText, duration);

        narration.onended = () => {
          callingPopup.style.display = "flex";
          ringtone.play().catch(err => console.warn("Ringtone blocked"));
        };
      }, 400);
    }
  </script>
</body></html>
